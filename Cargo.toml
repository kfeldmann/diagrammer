[package]
name = "diagrammer"
version = "0.1.0"
edition = "2024"

# Keep dead code from accumulating again. M20 deleted the rep model and its
# scaffolding; the crate-root `#![allow(dead_code)]` that used to hide the
# leftovers (unread fields, orphaned helpers, a production `DIAG_Q` debug
# block) is gone, so a regression must fail the build rather than warn.
[lints.rust]
dead_code = "deny"

[workspace]
members = ["tools/gen-metrics-table"]

[workspace.dependencies]
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
dejavu = "2.37"

[dependencies]
winnow = { version = "0.7", default-features = false, features = ["alloc"] }

# Font deps are NOT linked into the binary: measurement runs against the baked
# metrics in `src/metrics_table.rs`. These are only used by the regeneration
# tool (`tools/gen-metrics-table`) and the `font_verification` tests.
[dev-dependencies]
ttf-parser = { workspace = true }
dejavu = { workspace = true }

[[bin]]
name = "diagrammer"
path = "src/main.rs"

[profile.release]
# Ship stripped binaries (no hand-run `strip` step). Debug info is not used by
# anything in this project; keeping it out of the artifact keeps releases small
# and the output deterministic across build machines.
strip = true
